<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบขอยื่นคำร้องใบจบการศึกษา</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">


<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Kanit', 'Segoe UI', sans-serif;
}

body{
    background: linear-gradient(135deg,#ffffff,#fff5f5,#ffe9e9);
    min-height:100vh;
    color:#2b0000;
    overflow-x:hidden;
    position:relative;
}

body::before{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:rgba(255,0,0,0.12);
    border-radius:50%;
    top:-150px;
    left:-100px;
    filter: blur(120px);
    animation: blobMove1 12s ease-in-out infinite;
}

body::after{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:rgba(255,0,0,0.12);
    border-radius:50%;
    bottom:-150px;
    right:-100px;
    filter: blur(120px);
    animation: blobMove2 14s ease-in-out infinite;
}

@keyframes blobMove1{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(60px,40px) scale(1.15); }
}

@keyframes blobMove2{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-50px,-30px) scale(1.1); }
}

@keyframes fadeInUp{
    from{ opacity:0; transform: translateY(25px); }
    to{ opacity:1; transform: translateY(0); }
}

@keyframes floatLogo{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-8px) rotate(3deg); }
}

@keyframes shimmer{
    0%{ background-position: -200% center; }
    100%{ background-position: 200% center; }
}

.container{
    position:relative;
    z-index:1;
    text-align:center;
    padding-top:40px;
    padding-bottom:40px;
    opacity:0;
    animation: fadeInUp 0.7s ease-out forwards;
}

.logo{
    width:110px;
    height:110px;
    border-radius:50%;
    margin-bottom:15px;
    box-shadow:0 4px 20px rgba(179,0,0,0.25);
    background:#fff;
    padding:4px;
    animation: floatLogo 4s ease-in-out infinite;
}

h1{
    font-size:26px;
    font-weight:400;
    color:#2b0000;
    font-family:'Mitr', sans-serif;
}

h1 span{
    display:block;
    background: linear-gradient(90deg,#d90000,#ff5b5b,#d90000);
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-size:48px;
    font-weight:600;
    font-family:'Mitr', sans-serif;
    animation: shimmer 4s linear infinite;
}

.subtitle{
    color:#8a2b2b;
    margin-top:10px;
    opacity:0;
    animation: fadeInUp 0.7s ease-out 0.15s forwards;
}

.cards{
    display:flex;
    justify-content:center;
    gap:40px;
    margin-top:50px;
    flex-wrap:wrap;
}

.card{
    width:350px;
    padding:40px 30px;
    border-radius:20px;
    background:#ffffff;
    border:1px solid rgba(255,0,0,0.15);
    box-shadow:0 8px 30px rgba(179,0,0,0.08);
    backdrop-filter: blur(10px);
    transition:transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease, background 0.35s ease;
    opacity:0;
    animation: fadeInUp 0.7s ease-out forwards;
    position:relative;
    overflow:hidden;
}

.card:nth-child(1){ animation-delay: 0.3s; }
.card:nth-child(2){ animation-delay: 0.45s; }

.card:hover{
    transform:translateY(-12px) scale(1.02);
    box-shadow:0 16px 40px rgba(179,0,0,0.2);
}

.card.red{
    border:1px solid rgba(0,0,0,0.1);
}

.card.red:hover{
    border-color:#ff2d2d;
    background:#fff8f8;
    box-shadow:0 16px 40px rgba(179,0,0,0.25);
}

/* การ์ดสีเทา (ตรวจสอบสถานะ) เปลี่ยนเป็นธีมแดงตอนเอาเมาส์ชี้ */
.card.dark{
    border:1px solid rgba(0,0,0,0.1);
}

.card.dark:hover{
    border-color:#ff2d2d;
    background:#fff8f8;
    box-shadow:0 16px 40px rgba(179,0,0,0.25);
}

.icon{
    width:120px;
    height:120px;
    border-radius:50%;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:50px;
    margin-bottom:25px;
    color:#fff;
    transition: transform 0.4s ease, background 0.4s ease;
}

.card:hover .icon{
    transform: scale(1.1) rotate(-6deg);
}

.red .icon{
    background:linear-gradient(#5a5a5a,#2b2b2b);
}

.red:hover .icon{
    background:linear-gradient(#ff4b4b,#b30000);
}

.dark .icon{
    background:linear-gradient(#5a5a5a,#2b2b2b);
}

.dark:hover .icon{
    background:linear-gradient(#ff4b4b,#b30000);
}

.card h2{
    margin-bottom:10px;
    color:#2b0000;
    font-family:'Mitr', sans-serif;
    font-weight:500;
    transition: color 0.35s ease;
}

.red:hover h2{
    color:#b30000;
}

.dark:hover h2{
    color:#b30000;
}

.card p{
    color:#7a4d4d;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    padding:12px 30px;
    border-radius:10px;
    background:linear-gradient(#5a5a5a,#2b2b2b);
    color:white;
    text-decoration:none;
    font-weight:bold;
    box-shadow:0 4px 15px rgba(0,0,0,0.25);
    position:relative;
    overflow:hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.35s ease, box-shadow 0.35s ease;
}

.btn:hover{
    transform: translateY(-3px);
}

/* ปุ่มเปลี่ยนเป็นสีแดงตอนเอาเมาส์ชี้ที่การ์ด (ทั้งสองการ์ด) */
.red:hover .btn,
.dark:hover .btn{
    background:linear-gradient(#ff3b3b,#b00000);
    box-shadow:0 8px 20px rgba(179,0,0,0.4);
}

.btn:active{
    transform: translateY(0);
}

.ripple{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.55);
    transform:scale(0);
    animation: rippleEffect 0.6s ease-out;
    pointer-events:none;
}

@keyframes rippleEffect{
    to{ transform:scale(3); opacity:0; }
}

.footer{
    margin-top:50px;
    color:#8a2b2b;
    opacity:0;
    animation: fadeInUp 0.7s ease-out 0.6s forwards;
}
</style>
</head>
<body>

<div class="container">

    <!-- โลโก้ -->
    <img src="cmt-logo.png" class="logo">

    <h1>
        ระบบขอยื่นคำร้อง
        <span>ใบจบการศึกษา</span>
    </h1>

    <div class="subtitle">
        สะดวก รวดเร็ว ตรวจสอบได้
    </div>

    <div class="cards">

        <div class="card red">
            <div class="icon">
                <i class="fa-solid fa-file-signature"></i>
            </div>

            <h2>ขอยื่นใบคำร้อง</h2>
            <p>
                ยื่นคำร้องขอใบจบการศึกษา<br>
                กรอกข้อมูลและแนบเอกสาร
            </p>

            <a href="request.html" class="btn">
                คลิกเพื่อดำเนินการ
            </a>
        </div>

        <div class="card dark">
            <div class="icon">
                <i class="fa-solid fa-clipboard-check"></i>
            </div>

            <h2>ตรวจสอบสถานะใบคำร้อง</h2>
            <p>
                ตรวจสอบสถานะและความคืบหน้า<br>
                ของคำร้องที่ได้ยื่นไว้
            </p>

            <a href="status.html" class="btn">
                คลิกเพื่อตรวจสอบ
            </a>
        </div>

    </div>

    <div class="footer">
        🎓 ฝ่ายทะเบียน วิทยาลัยเทคโนโลยีชลบุรี | Graduate Request System
    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    // เอฟเฟกต์ ripple ตอนคลิกปุ่ม
    document.querySelectorAll('.btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
            const rect = btn.getBoundingClientRect();
            const ripple = document.createElement('span');
            const size = Math.max(rect.width, rect.height);
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top  = (e.clientY - rect.top - size / 2) + 'px';
            btn.appendChild(ripple);
            setTimeout(function () { ripple.remove(); }, 600);
        });
    });
});
</script>

</body>
</html>
